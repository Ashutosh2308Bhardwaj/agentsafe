version: "2"
linters:
  default: standard            # errcheck, govet, ineffassign, staticcheck, unused
  enable:
    - bodyclose
    - copyloopvar
    - errname
    - errorlint
    - exhaustive               # every switch on Status/EventType handles every case
    - gocritic
    - gosec
    - misspell
    - nilerr
    - nolintlint
    - revive
    - unconvert
    - unparam
  settings:
    exhaustive:
      default-signifies-exhaustive: true
    revive:
      rules:
        - name: exported
        - name: package-comments
        - name: var-naming
        - name: error-strings
        - name: unused-parameter
  exclusions:
    rules:
      - path: _test\.go
        linters: [gosec, errcheck, unparam]
      - path: examples/
        linters: [gosec]
formatters:
  enable: [gofmt, goimports]

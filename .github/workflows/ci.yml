name: ci
on:
  push: { branches: [main] }
  pull_request:
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        go: ["1.23", "stable"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version: "${{ matrix.go }}" }
      - run: go build ./...
      - run: go vet ./...
      - run: go test -race -count=1 ./...
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version: stable }
      - name: gofmt
        run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)
      - name: coverage (core package)
        run: |
          go test -coverprofile=coverage.out -covermode=atomic .
          go tool cover -func=coverage.out | tail -1
      - uses: golangci/golangci-lint-action@v8
        with: { version: latest }
      - name: staticcheck
        run: go run honnef.co/go/tools/cmd/staticcheck@latest ./...
      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...
  crash-harness:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version: stable }
      - name: kill -9 at every point of the money flow (scripted model)
        run: ./scripts/money_sweep.sh
      - name: the same, with the log sealed at rest (a test key, not a secret)
        run: ./scripts/money_sweep.sh
        env: { AGENTSAFE_LOG_KEY: "4242424242424242424242424242424242424242424242424242424242424242" } # quoted: unquoted, YAML reads 64 digits as a float

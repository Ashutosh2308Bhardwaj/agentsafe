name: ci
on:
  push: { branches: [main] }
  pull_request:
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        go: ["1.23", "stable"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with: { go-version: "${{ matrix.go }}" }
      - run: go build ./...
      - run: go vet ./...
      - run: go test -race -count=1 ./...
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with: { go-version: stable }
      - name: gofmt -s
        run: test -z "$(gofmt -s -l .)" || (gofmt -s -l . && exit 1)
      - name: coverage (core package)
        run: |
          go test -coverprofile=coverage.out -covermode=atomic .
          go tool cover -func=coverage.out | tail -1
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with: { version: latest }
      - name: staticcheck
        # staticcheck 0.8.1 (the latest) can't read Go 1.27's export data: run it on 1.26 until a release does.
        env: { GOTOOLCHAIN: go1.26.9 }
        run: go run honnef.co/go/tools/cmd/staticcheck@latest ./...
      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...
  # Storage backends are separate modules (the core stays dependency-free) with their own minimum Go: their
  # drivers'. Each runs the storetest conformance suite.
  backends:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        go: [oldstable, stable]
        module: [sqlite, anthropic, gemini, mcp]
    runs-on: ${{ matrix.os }}
    defaults: { run: { working-directory: "${{ matrix.module }}" } }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with: { go-version: "${{ matrix.go }}", cache-dependency-path: "${{ matrix.module }}/go.sum" }
      - name: use this commit's core, not the released one (a workspace; go.mod stays as users see it)
        working-directory: .
        shell: bash
        run: |
          go work init . "./${{ matrix.module }}"
          go work edit -go=1.26.0 # the highest any module needs, so staticcheck's older Go accepts it
      - run: go vet ./...
      - run: go test -race -count=1 ./...
  postgres:
    # Service containers only run on Linux runners; the backend is network code, the same on every OS.
    strategy:
      fail-fast: false
      matrix:
        go: [oldstable, stable]
        pg: ["14", "17"] # the oldest and newest Postgres versions we support
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:${{ matrix.pg }}
        env: { POSTGRES_USER: agentsafe, POSTGRES_PASSWORD: agentsafe, POSTGRES_DB: agentsafe_test }
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U agentsafe" --health-interval 2s --health-timeout 5s --health-retries 15
    env:
      AGENTSAFE_POSTGRES_URL: postgres://agentsafe:agentsafe@localhost:5432/agentsafe_test?sslmode=disable
      AGENTSAFE_REQUIRE_POSTGRES: "1" # fail, don't skip, if the database isn't there
    defaults: { run: { working-directory: postgres } }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with: { go-version: "${{ matrix.go }}", cache-dependency-path: postgres/go.sum }
      - name: use this commit's core, not the released one (a workspace; go.mod stays as users see it)
        working-directory: .
        shell: bash
        run: go work init . ./postgres
      - run: go vet ./...
      - run: go test -race -count=1 ./...
  backends-quality:
    strategy:
      fail-fast: false
      matrix:
        module: [sqlite, postgres, anthropic, gemini, mcp]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with: { go-version: stable, cache-dependency-path: "${{ matrix.module }}/go.sum" }
      - name: use this commit's core, not the released one (a workspace; go.mod stays as users see it)
        shell: bash
        run: |
          go work init . "./${{ matrix.module }}"
          go work edit -go=1.26.0 # the highest any module needs, so staticcheck's older Go accepts it
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with: { version: latest, working-directory: "${{ matrix.module }}", args: --config ../.golangci.yml }
      - name: staticcheck
        working-directory: ${{ matrix.module }}
        env: { GOTOOLCHAIN: go1.26.9 } # see the quality job
        run: go run honnef.co/go/tools/cmd/staticcheck@latest ./...
      - name: govulncheck
        working-directory: ${{ matrix.module }}
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...
  fuzz:
    # Each target searches for 30s beyond its seeds; a failure is saved under testdata/fuzz and fails the job.
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [FuzzReadLog, FuzzRebuild, FuzzCanonicalKeepsNumbersExact, FuzzCanonicalIsStable, FuzzOpenSealed, FuzzFuncArgs]
        pkg: ["."]
        include:
          - { target: FuzzSame, pkg: ./reconcile }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with: { go-version: stable }
      - run: go test -run '^$' -fuzz='^${{ matrix.target }}$' -fuzztime=30s ${{ matrix.pkg }}
      - if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with: { name: "fuzz-${{ matrix.target }}", path: "**/testdata/fuzz" }
  crash-harness:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with: { go-version: stable }
      - name: kill -9 at every point of the money flow (scripted model)
        run: ./scripts/money_sweep.sh
      - name: the same, with the log sealed at rest (a test key, not a secret)
        run: ./scripts/money_sweep.sh
        env: { AGENTSAFE_LOG_KEY: "4242424242424242424242424242424242424242424242424242424242424242" } # quoted: unquoted, YAML reads 64 digits as a float
  # A real LangGraph agent (Python) using a billing MCP server through agentsafe-mcp, with a person approving
  # from the command line: the claim that agentsafe works under any MCP framework, run on every push.
  langgraph-e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with: { go-version: stable, cache-dependency-path: mcp/go.sum }
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with: { python-version: "3.12" }
      - name: install the Python agent's dependencies (every one pinned by hash)
        run: python -m pip install --require-hashes -r mcp/examples/langgraph/requirements.txt
      - name: the agent, the proxy, the billing server, and an approval
        run: ./mcp/examples/langgraph/run.sh
        env: { PYTHON: python }

name: codeql
on:
  push: { branches: [main] }
  pull_request:
  schedule: [{ cron: "23 4 * * 1" }] # weekly, so new queries run against unchanged code too
permissions:
  contents: read
jobs:
  analyze:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write # upload the results to code scanning
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with: { go-version: stable }
      - uses: github/codeql-action/init@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with: { languages: go, build-mode: manual, queries: security-and-quality }
      - name: build every module (a workspace, so the modules build against this commit's core)
        run: |
          go work init . ./sqlite ./postgres ./anthropic ./gemini ./mcp
          go build ./... ./sqlite/... ./postgres/... ./anthropic/... ./gemini/... ./mcp/...
      - uses: github/codeql-action/analyze@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with: { category: "/language:go" }

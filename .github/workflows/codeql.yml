name: codeql
on:
  push: { branches: [main] }
  pull_request:
  schedule: [{ cron: "23 4 * * 1" }] # weekly, so new queries run against unchanged code too
permissions:
  contents: read
jobs:
  analyze:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write # upload the results to code scanning
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with: { go-version: stable }
      - uses: github/codeql-action/init@1bd86f2fdb4b86187fa4059f16f31a3202acc9ea # v4.39.4
        with: { languages: go, build-mode: manual, queries: security-and-quality }
      - name: build every module (a workspace, so the modules build against this commit's core)
        run: |
          go work init . ./sqlite ./postgres ./anthropic ./gemini ./mcp
          go build ./... ./sqlite/... ./postgres/... ./anthropic/... ./gemini/... ./mcp/...
      - uses: github/codeql-action/analyze@1bd86f2fdb4b86187fa4059f16f31a3202acc9ea # v4.39.4
        with: { category: "/language:go" }
